<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NASAR AI • Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui;height:100vh;display:flex;flex-direction:column;background: radial-gradient(circle at 20% 30%, #1a1033 0%, #0f0f0f 50%), radial-gradient(circle at 80% 80%, #331a2e 0%, #0f0f0f 60%);color:#fff;overflow:hidden}
#top{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;z-index:10}
#logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
#logo span{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#a855f7,#ec4899,#f59e0b);display:grid;place-items:center;font-size:20px;box-shadow:0 0 20px rgba(168,85,247,0.5)}
#badge{font-size:11px;padding:5px 10px;border-radius:20px;background:linear-gradient(135deg,#a855f7,#ec4899);font-weight:700}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.bubble{max-width:82%;padding:14px 18px;border-radius:20px;line-height:1.5;animation:pop 0.3s ease;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
@keyframes pop{from{transform:translateY(10px) scale(0.95);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.me{align-self:flex-end;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border-bottom-right-radius:6px;box-shadow:0 8px 20px rgba(168,85,247,0.3)}
.bot{align-self:flex-start;background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);border-bottom-left-radius:6px}
#bar{padding:14px;background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.1);display:flex;gap:10px;align-items:center}
#msg{flex:1;padding:15px 20px;border-radius:30px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.4);color:#fff;outline:none;font-size:15px;font-family:inherit}
#msg:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,0.2)}
#sendBtn{width:52px;height:52px;border-radius:50%;border:none;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 6px 18px rgba(168,85,247,0.4);transition:0.2s}
#sendBtn:active{transform:scale(0.9)}
.typing{opacity:0.7;font-style:italic}
</style>
</head>
<body>
<div id="top">
<div id="logo"><span>✨</span> NASAR AI</div>
<div id="badge">PREMIUM</div>
</div>
<div id="chat"></div>
<div id="bar">
<input id="msg" placeholder="Nasar, kuch bhi pucho... ✨">
<button id="sendBtn" type="button">↑</button>
</div>

<script>
// ===== YAHAN KEY DALNA - LINE 31 =====
const GROQ_API_KEY = "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";

const chatBox=document.getElementById('chat');
const msgInput=document.getElementById('msg');
const sendBtn=document.getElementById('sendBtn');

function addMsg(t,c){
 let d=document.createElement('div');
 d.className='bubble '+c;
 d.innerText=t;
 chatBox.appendChild(d);
 chatBox.scrollTop=chatBox.scrollHeight;
 return d;
}

async function sendMessage(){
 let q=msgInput.value.trim(); if(!q) return;
 addMsg(q,'me'); msgInput.value='';
 let bot=addMsg('NASAR AI soch raha hai... ✨','bot typing');
 try{
  let res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
   method:"POST",
   headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_API_KEY},
   body:JSON.stringify({
    model:"openai/gpt-oss-20b",
    messages:[
     {role:"system",content:"You are NASAR AI, premium personal assistant made by Nasar Khan from Patna, Bihar, India. You are NOT ChatGPT, NOT OpenAI, NOT Meta AI, NOT Groq. You were built by Nasar Khan. Your style is premium, stylish, colorful, friendly. Always answer in Hinglish (Hindi+English mix). If asked who are you, say: Main NASAR AI hu, mujhe mere malik Nasar Khan ne banaya hai. Be helpful, smart, premium."},
     {role:"user",content:q}
    ]
   })
  });
  let j=await res.json();
  bot.classList.remove('typing');
  if(j.error) bot.innerText="⚠️ Error: "+j.error.message;
  else bot.innerText=j.choices[0].message.content;
 }catch(e){bot.innerText="❌ Network Error: "+e.message}
}

sendBtn.onclick=sendMessage;
msgInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});

addMsg("Hey Nasar! 👋\nMain tera naya Premium NASAR AI hu ✨\n\nAb bata, kya banana hai aaj?","bot");
</script>
</body>
</html>
